name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Install Android build tools and platforms
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: node scripts/build-android.mjs debug

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: node scripts/build-android.mjs release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linecart-android-apks
          path: |
            dist-android/*.apk
            dist-android/*.sha256
            dist-android/build-info.json
          retention-days: 30
