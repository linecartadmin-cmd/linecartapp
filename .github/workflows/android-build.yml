name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & install build tools
        shell: bash
        run: |
          {
            set -e
            if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ] && [ -w "$ANDROID_HOME" ]; then
              SDK_ROOT="$ANDROID_HOME"
            elif [ -d "/usr/local/lib/android/sdk" ] && [ -w "/usr/local/lib/android/sdk" ]; then
              SDK_ROOT="/usr/local/lib/android/sdk"
            else
              SDK_ROOT="$HOME/android-sdk"
            fi
            echo "Using SDK_ROOT=$SDK_ROOT (ANDROID_HOME was '${ANDROID_HOME:-}')"
            mkdir -p "$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "$SDKMANAGER" ]; then
              echo "Downloading Android command-line tools..."
              curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              mkdir -p /tmp/cmdline-extract "$SDK_ROOT/cmdline-tools"
              unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
              rm -rf "$SDK_ROOT/cmdline-tools/latest"
              mv /tmp/cmdline-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
              rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi

            chmod +x "$SDKMANAGER"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
            set -o pipefail
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"
            echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          } > /tmp/sdk-setup.log 2>&1 || {
            ERR_MSG=$(tail -n 15 /tmp/sdk-setup.log | tr '\n' ' ')
            echo "::error::Android SDK setup failed: $ERR_MSG"
            cat /tmp/sdk-setup.log
            exit 1
          }
          cat /tmp/sdk-setup.log

      - name: Install server and client dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Run full test suite
        run: |
          mkdir -p dist-android
          node tests/run-tests.mjs | tee dist-android/test-results.txt

      - name: Build production-pointing DEBUG APK
        run: |
          chmod +x client/android/gradlew
          mkdir -p dist-android
          node scripts/build-android.mjs debug 2>&1 | tee dist-android/build-debug.log

      - name: Verify package ID, backend URL, signature, and SHA-256
        run: |
          APK_FILE=$(ls dist-android/linecart-*-debug.apk | head -n 1)
          echo "=== Inspect APK ===" | tee dist-android/apk-verification.txt
          node scripts/inspect-apk.mjs "$APK_FILE" \
            --expect-url https://linecart-staging.onrender.com \
            --expect-id in.linecart.suite.debug \
            --expect-debuggable true | tee -a dist-android/apk-verification.txt
          echo "=== Verify Signature ===" | tee -a dist-android/apk-verification.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE" | tee -a dist-android/apk-verification.txt
          echo "=== Verify SHA-256 ===" | tee -a dist-android/apk-verification.txt
          (cd dist-android && sha256sum -c "$(basename "$APK_FILE").sha256" | tee -a apk-verification.txt)

      - name: Upload Android DEBUG APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linecart-android-debug-apk
          path: |
            dist-android/linecart-*-debug.apk
            dist-android/linecart-*-debug.apk.sha256
            dist-android/build-info.json
            dist-android/test-results.txt
            dist-android/build-debug.log
            dist-android/apk-verification.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linecart-android-failure-logs
          path: |
            dist-android/*.txt
            dist-android/*.log
          retention-days: 14
          if-no-files-found: ignore
