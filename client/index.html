<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fa" />
    <link rel="icon" type="image/png" href="/lincart_flashicon.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-width: 100%;
        max-width: 100vw;
        min-height: 100%;
        min-height: 100dvh;
        background-color: #f6f8fa;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        width: 100%;
        min-width: 100%;
        max-width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }
      .app-shell {
        width: 100%;
        max-width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
      }
      @media (max-width: 780px) {
        .sidebar { display: none !important; }
        .main-area { margin-left: 0 !important; width: 100% !important; max-width: 100vw !important; }
      }
    </style>
    <!-- Fonts are self-hosted (client/public/fonts) so the Android app renders correctly offline. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Linecart — Wholesale ordering</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
