// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Optional: keep Gradle build output outside synced folders (OneDrive turns some generated folders into
    // read-only placeholders and breaks the build). scripts/build-android.mjs sets this automatically.
    def externalBuildRoot = System.getenv('LINECART_GRADLE_BUILD_ROOT')
    if (externalBuildRoot) {
        layout.buildDirectory = new File(externalBuildRoot, project.name)
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
