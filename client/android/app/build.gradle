import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Server target. Every build talks to exactly one server, defined in config/android-environments.json:
//   debug   build type + linecartTarget=production (default) -> in.linecart.suite.debug  "LineCart DEBUG"
//   release build type (always production)                   -> in.linecart.suite        "LineCart Wholesale"
//   debug   build type + -PlinecartTarget=local              -> in.linecart.suite.local  "LineCart LOCAL"
// Build with scripts/build-android.mjs; the bundle guard below refuses web assets built for another target.
// ---------------------------------------------------------------------------
def lcEnvs = new JsonSlurper().parse(rootProject.file('../../config/android-environments.json'))
def lcTarget = (project.findProperty('linecartTarget') ?: 'production').toString()
if (!(lcTarget in ['production', 'local'])) {
    throw new GradleException("[LineCart] linecartTarget must be 'production' or 'local', not '${lcTarget}'.")
}
def lcIsLocal = lcTarget == 'local'
// scripts/build-android.mjs copies the synced web assets outside OneDrive (which can briefly turn freshly written
// files into placeholders Gradle cannot read) and points the build at that copy. Unset = src/main/assets.
def lcAssetsDir = System.getenv('LINECART_ASSETS_DIR')

// ---------------------------------------------------------------------------
// Version: passed by scripts/build-android.mjs (-PlinecartVersionCode / -PlinecartVersionName),
// which reads client/package.json. Every Play/APK upgrade needs a higher versionCode.
// ---------------------------------------------------------------------------
def lcVersionCode = (project.findProperty('linecartVersionCode') ?: '2').toString().toInteger()
def lcVersionName = (project.findProperty('linecartVersionName') ?: '1.1.0').toString()

// ---------------------------------------------------------------------------
// Release signing: NEVER committed. Read from client/android/keystore.properties (git-ignored) or
// environment variables. Without them, release outputs are produced UNSIGNED.
//   storeFile=C:/path/outside/repo/linecart-release.jks
//   storePassword=...
//   keyAlias=linecart
//   keyPassword=...
// ---------------------------------------------------------------------------
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String envName -> keystoreProps.getProperty(key) ?: System.getenv(envName) }
def releaseStoreFile = signingValue('storeFile', 'LINECART_KEYSTORE_FILE')
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists() &&
        signingValue('storePassword', 'LINECART_KEYSTORE_PASSWORD') &&
        signingValue('keyAlias', 'LINECART_KEY_ALIAS') &&
        signingValue('keyPassword', 'LINECART_KEY_PASSWORD')

android {
    namespace = "in.linecart.suite"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.linecart.suite"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode lcVersionCode
        versionName lcVersionName
        manifestPlaceholders = [appLabel: "LineCart Wholesale"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (lcAssetsDir) {
        sourceSets.main.assets.srcDirs = [lcAssetsDir]
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'LINECART_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'LINECART_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'LINECART_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // Same production server and accounts as the release app; separate app id so both install side
            // by side (each keeps its own sign-in and device cache). Debuggable, WebView inspection on.
            debuggable true
            applicationIdSuffix lcIsLocal ? ".local" : ".debug"
            versionNameSuffix lcIsLocal ? "-local" : "-debug"
            manifestPlaceholders = [appLabel: lcIsLocal ? "LineCart LOCAL" : "LineCart DEBUG"]
        }
        release {
            // Not debuggable: no WebView inspection, no run-as. Signed only with the owner's release keystore.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (!hasReleaseSigning) {
    logger.lifecycle('[LineCart] No release signing configured (keystore.properties / LINECART_KEYSTORE_*): release outputs will be UNSIGNED.')
}

// ---------------------------------------------------------------------------
// Stale-bundle guard. Before assets are packaged, check that src/main/assets/public (copied by `cap sync`)
// was built by scripts/build-android.mjs for THIS variant's server, contains that URL, contains no other
// environment's URL or emulator/localhost address, and contains no credentials or keys.
// ---------------------------------------------------------------------------
def lcFail = { String variantName, String msg ->
    throw new GradleException("[LineCart] ${variantName}: ${msg}")
}
android.applicationVariants.all { variant ->
    def isRelease = variant.buildType.name == 'release'
    def expectedTarget = isRelease ? 'production' : lcTarget
    def expectedEnv = isRelease ? 'production' : (lcIsLocal ? 'local' : 'debug')
    def buildCmd = "node scripts/build-android.mjs ${isRelease ? 'release' : expectedEnv}"
    def taskSuffix = variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
    def publicDir = lcAssetsDir ? new File(lcAssetsDir, 'public') : file('src/main/assets/public')
    def verify = tasks.register("verifyLinecartWebBundle${taskSuffix}") {
        group = 'verification'
        description = "Checks the packaged web bundle targets ${expectedEnv}."
        outputs.upToDateWhen { false }
        doLast {
            if (isRelease && lcIsLocal) lcFail(variant.name, 'release builds always target production; remove -PlinecartTarget=local.')
            def marker = new File(publicDir, 'linecart-build.json')
            if (!marker.exists()) lcFail(variant.name, "web bundle has no linecart-build.json (stale or manual build). Build with: ${buildCmd}")
            def m = new JsonSlurper().parse(marker)
            def expectedUrl = lcEnvs[expectedTarget].apiUrl
            if (m.target != expectedTarget || m.appEnv != expectedEnv || m.apiUrl != expectedUrl) {
                lcFail(variant.name, "web bundle was built for '${m.appEnv}' (${m.apiUrl}) but this build needs '${expectedEnv}' (${expectedUrl}). Build with: ${buildCmd}")
            }
            def text = new StringBuilder()
            publicDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name ==~ /.*\.(js|html)$/) text.append(f.getText('UTF-8')).append('\n')
            }
            def s = text.toString()
            if (!s.contains(expectedUrl)) lcFail(variant.name, "web bundle does not contain ${expectedUrl}.")
            lcEnvs.each { k, v ->
                if (k != expectedTarget && v instanceof Map && v.apiUrl && s.contains(v.apiUrl)) {
                    lcFail(variant.name, "web bundle contains the ${k} server ${v.apiUrl}.")
                }
            }
            if (expectedTarget != 'local') {
                ['10.0.2.2', 'localhost:3001', '127.0.0.1:3001'].each { addr ->
                    if (s.contains(addr)) lcFail(variant.name, "web bundle contains the development address ${addr}.")
                }
            }
            def otherHosts = (s =~ /https?:\/\/[a-z0-9.-]+\.onrender\.com/).collect { it }.unique().findAll { it != expectedUrl }
            if (otherHosts) lcFail(variant.name, "web bundle contains other backend hosts: ${otherHosts.join(', ')}")
            [
                [/postgres(ql)?:\/\//, 'a database URL'],
                [/[a-z0-9]{20}\.supabase\.co|pooler\.supabase\.com/, 'a Supabase host'],
                [/service_role|SUPABASE_SERVICE_ROLE|sb_secret_/, 'a Supabase service key'],
                [/-----BEGIN [A-Z ]*PRIVATE KEY-----/, 'a private key']
            ].each { pair ->
                if (s =~ pair[0]) lcFail(variant.name, "web bundle contains ${pair[1]}. Never ship credentials in the app.")
            }
            logger.lifecycle("[LineCart] ${variant.name}: web bundle verified for '${expectedEnv}' -> ${expectedUrl}")
        }
    }
    variant.mergeAssetsProvider.configure { dependsOn verify }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Fused location provider for LocationIntegrityPlugin (same library and version @capacitor/geolocation uses)
    implementation "com.google.android.gms:play-services-location:${rootProject.ext.has('playServicesLocationVersion') ? rootProject.ext.playServicesLocationVersion : '21.3.0'}"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
